# Joschys_Tree – Workspace – @ Joschy
# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
authors = ["Joschy"]
description = "Joschys_Tree – schneller, portabler Festplatten-Analyzer für Windows (@ Joschy)"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
