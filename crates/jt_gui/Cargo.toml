# Joschys_Tree – GUI-Programm jt_gui – @ Joschy
# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "jt_gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Joschys_Tree GUI (eframe/egui) – @ Joschy"
build = "build.rs"

[[bin]]
name = "JoschysTree"
path = "src/main.rs"

[dependencies]
jt_core = { path = "../jt_core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui_extras = { version = "0.37", default-features = false }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.5"
