# Joschys_Tree – CI – @ Joschy
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Tests
        run: cargo test --workspace

  windows-build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --target x86_64-pc-windows-msvc -- -D warnings
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc -p jt_gui
      - name: Copy exe
        shell: bash
        run: |
          mkdir -p target/release
          cp target/x86_64-pc-windows-msvc/release/JoschysTree.exe target/release/JoschysTree.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JoschysTree-windows-x64
          path: target/release/JoschysTree.exe
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/JoschysTree.exe
